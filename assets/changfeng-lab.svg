<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">长风 · AI 探索者与构建者</title><desc id="desc">深色技术画布上，模型、智能体、工具和运行环境形成开放连接。心有所向，行有所成。</desc>
<defs>
<filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<linearGradient id="facet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3d818d"/><stop offset=".5" stop-color="#245368"/><stop offset="1" stop-color="#173549"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91fff0"/><stop offset=".5" stop-color="#50d4e8"/><stop offset="1" stop-color="#8b9dff"/></linearGradient>
<radialGradient id="floor"><stop stop-color="#45d6dc" stop-opacity=".19"/><stop offset="1" stop-color="#45d6dc" stop-opacity="0"/></radialGradient>

 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1422"/><stop offset="1" stop-color="#111e2c"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#42d9d0" stop-opacity=".16"/><stop offset="1" stop-color="#42d9d0" stop-opacity="0"/></radialGradient>
 <linearGradient id="wind"><stop stop-color="#58d9ce" stop-opacity="0"/><stop offset=".5" stop-color="#58d9ce" stop-opacity=".4"/><stop offset="1" stop-color="#8aa4ff" stop-opacity=".07"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9ab7cb" stroke-opacity=".055"/></pattern>
 <linearGradient id="link"><stop stop-color="#46d9cb"/><stop offset="1" stop-color="#6998fb"/></linearGradient>
</defs>
<rect width="1200" height="400" rx="16" fill="url(#bg)"/>
<rect width="1200" height="400" rx="16" fill="url(#grid)"/>
<style>
.core-pulse{opacity:.45}
.data-flow,.orbit-scan{display:none}
@media (prefers-reduced-motion:no-preference){
 .core-pulse{animation:breathe 5s ease-in-out infinite}
 .signal-a{animation:signal 5s ease-in-out infinite}
 .signal-b{animation:signal 5s ease-in-out 2.5s infinite}
 .data-flow,.orbit-scan{display:inline}
 .data-flow{animation:transfer 6s linear infinite}
 .flow-tools{animation-delay:-3s}
 .flow-agents{animation-delay:-1.5s}
 .flow-runtime{animation-delay:-4.5s}
 .orbit-scan{animation:scan 18s linear infinite}
}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes signal{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes transfer{from{stroke-dashoffset:0}to{stroke-dashoffset:var(--travel)}}
@keyframes scan{from{stroke-dashoffset:0}to{stroke-dashoffset:var(--travel)}}
</style>
<g fill="#8dbbce" opacity=".45"><circle cx="655" cy="85" r="1"/><circle cx="1135" cy="156" r="1.2"/><circle cx="704" cy="240" r="1"/><circle cx="1102" cy="334" r="1"/><circle cx="954" cy="60" r="1"/><circle cx="660" cy="310" r="1.4"/></g>
<g fill="none" stroke="#87c9d7" stroke-opacity=".35"><path d="M666 118V98h20M1116 98h20v20M666 288v20h20M1116 308h20v-20"/></g>
<ellipse cx="902" cy="271" rx="141" ry="44" fill="url(#floor)"/>
<g fill="none" stroke="url(#edge)">
 <ellipse cx="902" cy="271" rx="104" ry="29" stroke-opacity=".2"/>
 <ellipse cx="902" cy="271" rx="85" ry="22" stroke-opacity=".45" stroke-dasharray="90 12 12 12"/>
 <path d="M902 93v28M902 273v10" stroke-opacity=".45" stroke-dasharray="2 5"/>
</g>
<circle cx="900" cy="194" r="230" fill="url(#halo)"/>
<g fill="none" stroke="url(#wind)">
 <path d="M360 350C590 370 620 265 760 245S1000 325 1200 200" stroke-width="1.2"/>
 <path d="M300 362C560 390 650 290 790 270S1040 350 1200 235" stroke-width=".8"/>
 <path d="M420 335C630 340 630 245 770 220S1020 300 1200 170" stroke-width=".6"/>
</g>
<path d="M48 42h1104M48 356h1104" stroke="#344454" stroke-width="1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
 <circle cx="55" cy="72" r="4" fill="#5ce0c2"/>
 <text x="70" y="77" fill="#9cb3c8" font-size="13" letter-spacing="2">iShangZhi / BUILDER’S LOG</text>
 <text x="54" y="163" fill="#f1f6fc" font-size="62" font-weight="700" letter-spacing="4">长风<tspan dx="20" fill="#8da7be" font-size="24" font-weight="400" letter-spacing="1">CHANGFENG</tspan></text>
 <text x="56" y="211" fill="#66ddd1" font-size="21" letter-spacing="1">追逐 AI 前沿，构建开放未来</text>
 <text x="56" y="267" fill="#e0e8f1" font-size="23" letter-spacing="3">心有所向，行有所成。</text>
 <text x="57" y="297" fill="#8fa6bb" font-size="14">Let purpose guide you. Let action define you.</text>
 <text x="56" y="380" fill="#8097ac" font-size="11" letter-spacing="2">EXPLORE / BUILD / SHARE</text>
 <text x="1144" y="380" fill="#8097ac" font-size="11" text-anchor="end" letter-spacing="1">CURIOUS MIND. HANDS-ON BUILDER.</text>
</g>
<g fill="none">
 <ellipse cx="902" cy="200" rx="188" ry="126" stroke="#47627a" stroke-opacity=".45"/>
 <ellipse cx="902" cy="200" rx="157" ry="86" transform="rotate(-32 902 200)" stroke="#47627a" stroke-opacity=".35"/>
 <path d="M745 123 902 200 1060 117M902 200 1057 281M902 200 752 286" stroke="url(#link)" stroke-width="1.5"/>
 <path d="M745 123 1060 117 1057 281 752 286Z" stroke="#587388" stroke-dasharray="3 8" stroke-opacity=".45"/>
 <!-- Directional light travels along existing links; the core occludes incoming paths. -->
 <g stroke-linecap="round" fill="none" aria-hidden="true">
  <g stroke="#76eadc" stroke-width="3" stroke-dasharray="1.6 98.4">
   <path class="data-flow flow-models" style="--travel:-174.87;stroke-dasharray:3 171.87" d="M745 123 902 200"/>
   <path class="data-flow flow-tools" style="--travel:-172.90;stroke-dasharray:3 169.90" d="M752 286 902 200"/>
  </g>
  <g stroke="#b3caff" stroke-width="3" stroke-dasharray="1.6 98.4">
   <path class="data-flow flow-agents" style="--travel:-178.47;stroke-dasharray:3 175.47" d="M902 200 1060 117"/>
   <path class="data-flow flow-runtime" style="--travel:-174.89;stroke-dasharray:3 171.89" d="M902 200 1057 281"/>
  </g>
  <ellipse class="orbit-scan" style="--travel:-996.10;stroke-dasharray:65 931.10" cx="902" cy="200" rx="188" ry="126" stroke="#77ccc9" stroke-width="1.7" stroke-opacity=".8" stroke-dasharray="7 93"/>
 </g>
 <path d="m902 138 62 36v68l-62 36-62-36v-68Z" fill="#0a1420" stroke="#344f63"/>
 <path d="m902 128 62 36-62 36-62-36Z" fill="url(#facet)" stroke="url(#edge)" stroke-width="1.4"/>
 <path d="m840 164 62 36v66l-62-36Z" fill="#153547" stroke="#57889a"/>
 <path d="m902 200 62-36v66l-62 36Z" fill="#102839" stroke="#57889a"/>
 <path class="core-pulse" d="m902 128 62 36-62 36-62-36Z" fill="none" stroke="#74ffeb" stroke-width="3" filter="url(#bloom)"/>
 <path d="m902 112 48 28-48 28-48-28Z" fill="#48d6d4" fill-opacity=".035" stroke="#7de5df" stroke-opacity=".45"/>
 <path d="m902 94 34 20-34 20-34-20Z" fill="#48d6d4" fill-opacity=".025" stroke="#7de5df" stroke-opacity=".25"/>
 <path d="M854 140v24M950 140v24" stroke="#87ebe3" stroke-opacity=".45" stroke-dasharray="2 4"/>
 <path d="m852 183 38 22v39M914 242v-37l38-22" stroke="#6ca4bf" stroke-opacity=".4"/>
 <path d="m859 198 22 13v21M923 232v-21l22-13" stroke="#65c4cc" stroke-opacity=".4"/>
 <path d="m902 140 40 24-40 23-40-23Z" fill="#284e5d" stroke="#6bcec8" stroke-opacity=".55"/>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
 <text x="902" y="171" font-size="17" fill="#edfcff" font-weight="600" letter-spacing="2">AI</text><text x="902" y="301" font-size="10" letter-spacing="2" fill="#82c7c9">FROM IDEAS TO SYSTEMS</text>
 <g fill="none" stroke="#57d8d0" stroke-opacity=".25"><circle cx="745" cy="123" r="12"/><circle cx="1060" cy="117" r="12"/><circle cx="1057" cy="281" r="12"/><circle cx="752" cy="286" r="12"/></g><g fill="#142d3b" stroke="#82d8df"><circle cx="745" cy="123" r="7"/><circle cx="1060" cy="117" r="7"/><circle cx="1057" cy="281" r="7"/><circle cx="752" cy="286" r="7"/></g>
 <g fill="#c7d9e8" font-size="15"><text x="745" y="102">模型 / MODELS</text><text x="1060" y="96">智能体 / AGENTS</text><text x="1057" y="312">运行环境 / RUNTIME</text><text x="752" y="317">工具 / TOOLS</text></g>
 <g class="signal-a"><circle cx="825" cy="162" r="7" fill="#66ddd1" opacity=".45" filter="url(#bloom)"/><circle cx="825" cy="162" r="3" fill="#b4fff1"/></g><g class="signal-b"><circle cx="984" cy="157" r="7" fill="#8ba9ff" opacity=".55" filter="url(#bloom)"/><circle cx="984" cy="157" r="3" fill="#b3d4ff"/></g><circle cx="980" cy="240" r="3" fill="#d7b385"/>
</g>
</svg>